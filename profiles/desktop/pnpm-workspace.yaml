packages:
  - .

nodeLinker: hoisted
autoInstallPeers: false
packageExtensions:
  dsh-web-search-pro@*:
    dependencies:
      '@anweat/dsh-browser': 0.1.3
minimumReleaseAgeExclude:
  - '@liustack/modlens@3.16.6'
  - '@struktoai/mirage-core@0.0.5'
  - '@struktoai/mirage-dsh@0.0.1'
  - '@struktoai/mirage-node@0.0.5'
  - dsh-context@0.7.3
  - dshmarket@1.5.0
  - dsh-better-sidebar@0.13.0
allowBuilds:
  '@jackwener/opencli': true
  '@photostructure/sqlite': true
  cloudflared: true
  cpu-features: true
  node-pty: true
  ssh2: true
  tree-sitter-bash: true
